# Weekly version updates, opened against dev like every other pull request. Minor and patch bumps
# are grouped into one PR per ecosystem and folder, so they don't flood the board; a major bump gets
# its own PR.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /src/backend/core
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directories:
      - /src/backend/optimizer
      - /src/research
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # uv_build moves together with uv itself, which ci.yml and the optimizer Dockerfile pin and
    # Dependabot cannot see (ADR-010, ADR-021).
    ignore:
      - dependency-name: uv-build
        versions: [">= 0.13"]

  - package-ecosystem: npm
    directory: /src/frontend/web
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # TypeScript stays on 6 until typescript-eslint supports 7 (ADR-012), and @types/node follows
    # the Node line in .nvmrc (ADR-010). See ADR-021.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /src/frontend/mobile
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # The Expo SDK fixes the versions that work together, so they move only with an SDK upgrade
    # (`npx expo install --fix`), never one package at a time (ADR-012, ADR-021). React Native is
    # 0.x, so its next release counts as a minor; the SDK pins React and React Native exactly.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-web

  - package-ecosystem: docker
    directories:
      - /src/backend/core
      - /src/backend/optimizer
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    # The runtimes stay on the versions ADR-038 pins: Java 25, today's LTS in the pom, and Python
    # 3.14, the newest OR-Tools ships wheels for. Moving either is a decision, not a bump (ADR-021).
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
