# Weekly version updates. Minor and patch bumps are grouped into one PR per ecosystem and folder,
# so they don't flood the board; a major bump gets its own PR.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /src/backend/core
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directories:
      - /src/backend/solver
      - /src/research
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /src/frontend/console
      - /src/frontend/driver-app
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /src/backend/core
      - /src/backend/solver
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
