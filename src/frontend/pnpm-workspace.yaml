# The web app and the shared @dispatchflow/* packages, with one lockfile (ADR-039).
#
# The phone app stays on npm, outside the workspace, until M10: Metro under pnpm is unchecked
# (ADR-039, Hard). Never widen these patterns to cover mobile/, `*` included, or Expo takes this
# folder as the phone app's workspace root. A packages/ folder joins once the ticket that fills it
# adds its package.json; until then pnpm skips it.
packages:
  - web
  - packages/*

# `pnpm add` writes the exact version (TS §1 rule 4).
saveExact: true

# Every package formats its own files (ADR-141 decision 4). `pnpm -r run` skips a package without
# the script it runs, so instead a package missing format:check fails `just web-check`, and one
# missing format fails `just web-format`. The workspace's root is never selected, so it needs none.
requiredScripts:
  - format
  - format:check

# pnpm refuses a version published less than a day ago. 1440 is pnpm's default, but written out it
# also turns on minimumReleaseAgeStrict: when no version in range is a day old, pnpm doesn't fall
# back to a younger one on its own. It fails, or in a terminal asks first, and writes a younger
# version it was allowed to use to minimumReleaseAgeExclude. Dependabot's version updates read it
# from this file too, and then propose no version pnpm would refuse; its security updates skip it.
minimumReleaseAge: 1440

# A version published with less trust than the ones before it, such as one without the provenance
# its predecessors had, fails the install: the sign of a stolen publishing token.
trustPolicy: no-downgrade

# A script run with stale node_modules fails, rather than testing old dependencies; `just web-setup`
# brings them up to date.
verifyDepsBeforeRun: error

# What each dependency may do, the one place pnpm records it: `pnpm approve` and
# `pnpm approve-builds` write here. A request not listed fails the install (a build) or waits for
# `pnpm approve` (skills); `true` grants it and `false` refuses it.
# - `build` runs a dependency's install script. fsevents is macOS-only, comes in through Vite, and
#   ships its binary in the tarball, so it needs no build.
# - `skills` links instruction files for AI coding agents. None may: they would steer anyone's
#   agent in this repository from outside it (ADR-143).
permissions:
  fsevents:
    build: false
  '@tanstack/react-router':
    skills: false
