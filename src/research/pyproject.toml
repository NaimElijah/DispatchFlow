[project]
name = "dispatchflow-research"
version = "0.1.0"
description = "DispatchFlow research: the benchmark harness, the disruption simulation and the order generator"
authors = [
    { name = "Naim Elijah" },
    { name = "Shai Manor" },
    { name = "Bentzion Hadad" },
]
# OR-Tools publishes wheels up to Python 3.14 (ADR-038).
requires-python = ">=3.14,<3.15"
dependencies = [
    "dispatchflow-optimizer",
    "pyvrp>=0.14.1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dispatchflow-optimizer = { path = "../backend/optimizer", editable = true }

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names state their purpose; docstrings on them would repeat it.
"tests/**" = ["D"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
