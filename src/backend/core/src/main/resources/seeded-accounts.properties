# The seeded accounts: the one shared list that the dev and test profiles both import, so neither
# owns a copy (ADR-133, ADR-147). Each entry under dispatchflow.seeded-accounts.<entry> is a fixed
# account ID, its roles, an invented address on the reserved .test domain (RFC 6761), never a real
# person's, and its interface language. The stand-in session acts as the entry that
# dispatchflow.stand-in.account names, #181 stores one account per entry under its ID, and
# test code reads the IDs from this file through TestActors, never from a second copy. This file
# may not set any spring.profiles property: it is imported from profile-specific files.
dispatchflow.seeded-accounts.admin.id=0198c3a0-5d1e-7a01-8a00-00000000a001
dispatchflow.seeded-accounts.admin.roles=ADMIN
dispatchflow.seeded-accounts.admin.address=admin@dispatchflow.test
dispatchflow.seeded-accounts.admin.language=HEBREW

dispatchflow.seeded-accounts.dispatcher.id=0198c3a0-5d1e-7a01-8a00-00000000d001
dispatchflow.seeded-accounts.dispatcher.roles=DISPATCHER
dispatchflow.seeded-accounts.dispatcher.address=dispatcher@dispatchflow.test
dispatchflow.seeded-accounts.dispatcher.language=HEBREW

dispatchflow.seeded-accounts.driver.id=0198c3a0-5d1e-7a01-8a00-00000000e001
dispatchflow.seeded-accounts.driver.roles=DRIVER
dispatchflow.seeded-accounts.driver.address=driver@dispatchflow.test
dispatchflow.seeded-accounts.driver.language=ENGLISH
