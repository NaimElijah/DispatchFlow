spring.application.name=dispatchflow-core

# Flyway owns the schema (ADR-041, ADR-126). Hibernate never changes it: it only checks that
# each mapped table and column exists with a compatible type, not constraints or nullability.
spring.jpa.hibernate.ddl-auto=validate
# The core connects as app, which owns nothing and may change no schema, so it never runs Flyway:
# the migrate command does, as dispatchflow_owner, before the core starts (MigrateCommand, ADR-145).
spring.flyway.enabled=false
# Never log SQL, its bind values or the values read, which hold personal data (NFR-19, ADR-126).
# Each logger that writes them, the driver's too, has a level of its own, so raising the root
# level to debug a problem doesn't switch them on.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.hibernate.orm.jdbc.extract=INFO
logging.level.org.postgresql=INFO
# Every console line is one JSON object in Elastic Common Schema, with the MDC, so each carries the
# request's traceId that web's trace filter sets (NFR-20, tech_stack.md section 16).
logging.structured.format.console=ecs
# PostgreSQL's error detail quotes the failing row or key ("Failing row contains (...)"), and
# Hibernate logs every SQL error's message at WARN, so the driver leaves the detail out. The server's
# own log keeps it unless the database's deployment sets it otherwise (#250).
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
# The database session runs in UTC (ADR-088). The driver opens each session in the JVM's zone, so
# each new connection sets UTC before the pool hands it out.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
# PostgreSQL waits for a lock with no limit by default, so a transaction that held one too long would
# keep every waiter, and its pool connection, until it ended. Each wait for a lock ends after 2
# seconds, which the load test already counts as an error (NFR-239), and ADR-136 has the call
# retried. Every -c setting goes in this one string; the database URL carries no options of its own.
spring.datasource.hikari.data-source-properties.options=-c lock_timeout=2s
# A root's load check can read a collection while the root loads, as Delivery's reads its held
# reports, so loading many roots would cost a statement each. Batch fetching loads those collections
# together, up to a plan's 200 stops at once (NFR-05, ADR-128), so reading up to 200 roots costs
# the same statements as reading one.
spring.jpa.properties.hibernate.default_batch_fetch_size=200
# Use cases answer in api types before their transaction ends, so nothing outside a use case
# touches the persistence context (ADR-001), and each retry gets a fresh persistence context.
spring.jpa.open-in-view=false
# A multipart body is parsed only once its handler is chosen, so a request to no operation, or one
# the caller may not make, never makes the core parse it (ADR-140 decision 9). The caps sit above
# NFR-37's 5 MB proof image, so an over-size proof answers the domain's own refusal (ADR-140
# decision 5); a body over them answers 413.
spring.servlet.multipart.resolve-lazily=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB
# No operation takes a form body, and Spring's form filter would read a PUT, PATCH or DELETE form
# body whole, before routing and before the body's size limit (ADR-140 decision 9). Tomcat's own
# cap on a form POST it parses matches that limit, 1 MiB.
spring.mvc.formcontent.filter.enabled=false
server.tomcat.max-http-form-post-size=1MB
# Spring's own WARN line for a 405 quotes the method the client chose; the contract's handler logs
# each 405 at INFO with its status and code instead.
logging.level.org.springframework.web.servlet.PageNotFound=ERROR
# Tomcat's line for a request it can't parse, at INFO once a day per connection processor through
# its UserDataHelper, quotes the raw request target, query included, before any filter sets the
# trace ID; it answers the 400 itself either way.
logging.level.org.apache.coyote.http11.Http11Processor=WARN
# Reject a number the contract does not allow, instead of truncating 10.7 to 10 or reading "10" as 10.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
# The scheduled jobs run (SchedulingConfiguration, ADR-140 decision 10); the integration tests turn
# them off, so no job runs against the shared test database mid-test.
dispatchflow.scheduling.enabled=true
