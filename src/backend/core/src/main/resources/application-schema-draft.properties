# The schema-draft profile, meant for `just core-schema-draft` alone (ADR-126). It writes the DDL
# Hibernate would generate for the current mapping to target/schema-draft.sql, as a draft for a new
# migration, and stops. It opens no database connection and changes no schema: Flyway stays off and
# Hibernate reads no database metadata. The URL below is a placeholder; an environment's
# SPRING_DATASOURCE_URL would take its place, and still nothing would connect to it.
spring.main.web-application-type=none
spring.flyway.enabled=false
spring.datasource.url=jdbc:postgresql://localhost/schema-draft-never-connects
# none, not the validate every other profile uses: validate needs a database, and this has none.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Without database metadata Hibernate can't pick a dialect, whatever its HHH90000025 warning says.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# The PostgreSQL the core runs on (TS §6); without it the dialect drafts for PostgreSQL 14.
spring.jpa.properties.jakarta.persistence.database-major-version=18
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=target/schema-draft.sql
# Each module's schema too, so the draft names what its first migration must create (ADR-041).
spring.jpa.properties.jakarta.persistence.create-database-schemas=true
# Hibernate appends to the target by default, so each run would repeat the last one's DDL.
spring.jpa.properties.hibernate.hbm2ddl.schema-generation.script.append=false
spring.jpa.properties.hibernate.hbm2ddl.delimiter=;
spring.jpa.properties.hibernate.format_sql=true
