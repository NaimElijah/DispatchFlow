# The dev profile: `just core-run` and the Compose core (#146). It sits on the main classpath, so it
# never turns Flyway on: the Compose core connects as app, which may not migrate (ADR-146 decision
# 4). Nor does it name the stand-in session's account, so a deployment that runs dev by mistake
# refuses to boot: `just core-run` sets it from the test classpath, and the Compose core sets
# DISPATCHFLOW_STANDIN_ACCOUNT (ADR-147).
spring.config.import=classpath:seeded-accounts.properties
# The development core listens on the loopback interface alone; the Compose core overrides this
# inside its container (#146).
server.address=127.0.0.1
