# Test classpath only: the profile of every run against TestcontainersConfiguration's throwaway
# PostgreSQL, the integration tests and `just core-run`. Nothing else migrates that database, so
# Flyway runs in the core's JVM, as dispatchflow_owner on the configuration's owner pool, while the
# core itself connects as app. Everywhere else the migrate command alone runs Flyway (ADR-145).
spring.flyway.enabled=true
