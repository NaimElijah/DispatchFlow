# The test profile, which @IntegrationTest and @TomcatIntegrationTest activate. It is on the test
# classpath alone. The stand-in session acts as the shared list's Dispatcher (ADR-140 decision 4,
# ADR-147).
spring.config.import=classpath:seeded-accounts.properties
dispatchflow.stand-in.account=dispatcher
# The stand-in signs in every request, so a test's server listens on the loopback interface alone;
# @TomcatIntegrationTest pins it above the environment too (ADR-148).
server.address=127.0.0.1
# Nothing else migrates the throwaway PostgreSQL, so Flyway runs in the core's JVM, as
# dispatchflow_owner on TestcontainersConfiguration's owner pool, while the core itself connects as
# app. Everywhere else the migrate command alone runs Flyway (ADR-145, ADR-146 decision 4).
spring.flyway.enabled=true
# No scheduled job runs against the shared test database mid-test (ADR-140 decision 10).
dispatchflow.scheduling.enabled=false
