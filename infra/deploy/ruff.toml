# ruff's settings for check_dev_stack.py, the script `just infra-check` runs (ADR-151): the
# optimizer's line length and its rules for code outside its domain
# (src/backend/optimizer/pyproject.toml). The script prints its results, which is its job.
line-length = 100
target-version = "py314"

[lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "D"]

[lint.pydocstyle]
convention = "google"
